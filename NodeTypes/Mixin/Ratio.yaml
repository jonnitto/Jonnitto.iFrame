"Jonnitto.iFrame:Mixin.Ratio":
  abstract: true
  properties:
    ratio:
      type: string
      ui:
        label: i18n
        showInCreationDialog: true
        reloadIfChanged: true
        inspector:
          group: settings
          editor: Neos.Neos/Inspector/Editors/SelectBoxEditor
          position: 300
          editorOptions:
            allowEmpty: true
            values:
              "16 / 9":
                label: "16:9"
              "4 / 3":
                label: "4:3"
              "1 / 1":
                label: "1:1"
